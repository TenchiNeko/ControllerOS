name: Controller Compatibility Report
description: Share what a controller exposes and what you were able to test.
title: "[hardware] "
body:
  - type: input
    id: model
    attributes:
      label: Controller manufacturer and model
      description: Optional if unknown; do not include a serial number.
      placeholder: Manufacturer and retail model
  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      options:
        - Wired USB
        - Bluetooth
        - Wireless dongle
        - Other or unknown
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: For example, Windows 11 24H2
    validations:
      required: true
  - type: input
    id: controlleros
    attributes:
      label: ControllerOS version and commit
      placeholder: Copy from controlleros.exe version --json
    validations:
      required: true
  - type: textarea
    id: detected
    attributes:
      label: Detected controls
      description: List the controls shown by inspect or encountered during teaching.
      placeholder: South, East, left stick X/Y, triggers, D-pad...
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: Controls that worked
      description: List controls that mapped and behaved as expected.
      placeholder: Leave blank if none worked.
  - type: textarea
    id: failed
    attributes:
      label: Controls that failed or were unavailable
      description: Include controls you skipped and any unexpected behavior.
      placeholder: Leave blank if all controls you tried worked.
  - type: textarea
    id: outcome
    attributes:
      label: Mapping and calibration outcome
      description: Say whether report validation passed and describe anything ambiguous.
      placeholder: State which controls mapped and whether calibration looked usable.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options:
        - maintainer-tested
        - contributor-tested
        - mapping-only
        - unverified
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Optional sanitized report
      description: Review reports and attachments before uploading. Remove usernames, computer names, paths, serials, IPs, credentials, and unrelated logs. Paste reviewed JSON here or attach after creating the issue.
      placeholder: Review the complete file before sharing, even when generated by ControllerOS.
