name: Feature Request
description: Suggest a change or explain a problem ControllerOS could address.
title: "[request] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe your use case and current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A rough idea is enough; implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Who would this help and how?
      description: Requests help guide discussion; they do not guarantee implementation.
